name: Release

# Builds a signed release APK. Trigger by pushing a version tag (e.g. `git tag v1.5 && git push
# origin v1.5`) — that also creates a GitHub Release with the APK attached. Or run manually from the
# Actions tab (workflow_dispatch) to just produce the APK artifact.
#
# ForestNote's build pulls two sibling projects that live outside this repo during local dev:
#   - vw_ink_sdk_unofficial — a Gradle *composite build* (`includeBuild("../vw_ink_sdk_unofficial")`),
#     so it just needs its source checked out as a sibling of the ForestNote checkout.
#   - RhizomeSync (io.rhizome:*) — another source composite, verified against
#     gradle/rhizome-integration-revision.txt before configuration can succeed.
# Both are public repos, so the default token can clone them. To keep the sibling layout the
# `includeBuild("../…")` path expects, every repo is checked out into a subdirectory of the workspace.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ForestNote
        uses: actions/checkout@v4
        with:
          path: ForestNote

      # PINNED to a tag on purpose. This one is a SOURCE dependency — `includeBuild` + the
      # dependencySubstitution in settings.gradle.kts compile this checkout straight into the APK —
      # so an unpinned default-branch checkout would mean the shipped ink code is whatever main was
      # at build time. Note there is no version to cross-check it against: core/ink declares
      # io.github.vwunofficial:viwoods-ink:0.2.0, but substitution means that string is
      # never resolved, so this ref is the ONLY record of which SDK source a release was built from.
      - name: Checkout Viwoods ink SDK (composite build sibling)
        uses: actions/checkout@v4
        with:
          repository: jdkruzr/vw_ink_sdk_unofficial
          ref: v0.2.0
          path: vw_ink_sdk_unofficial

      # Source dependency: keep this exact ref in lockstep with
      # gradle/rhizome-integration-revision.txt. Never publish integration code
      # under an existing versioned Maven coordinate.
      - name: Checkout RhizomeSync
        uses: actions/checkout@v4
        with:
          repository: jdkruzr/rhizome
          ref: 5b05030aabc6e14f38575a867d9b0cac3b50bc13
          path: rhizome

      # JDK 21: supported by AGP 8.7, Gradle 9.1, and Kotlin 2.0.21 (ForestNote) + 2.2.0 (rhizome).
      # This MUST match `jvmToolchain(...)` in build-logic's convention plugins — that pin is what
      # makes local and CI compile on the same JDK instead of differing by accident (dev boxes here
      # default to JDK 25). Was 17; moved to 21 because it is the newest JDK all four tools support
      # that is already present on the dev box, so no toolchain auto-provisioning is needed.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Android settings verifies this source pin and uses a composite build;
      # unpublished integration code must not replace versioned Maven artifacts.

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: ForestNote
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:notes:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forestnote-release-apk
          path: ForestNote/app/notes/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ForestNote/app/notes/build/outputs/apk/release/*.apk
          generate_release_notes: true
