name: Release

# Builds a signed release APK. Trigger by pushing a version tag (e.g. `git tag v1.5 && git push
# origin v1.5`) — that also creates a GitHub Release with the APK attached. Or run manually from the
# Actions tab (workflow_dispatch) to just produce the APK artifact.
#
# ForestNote's build pulls two sibling projects that live outside this repo during local dev:
#   - vw_ink_sdk_unofficial — a Gradle *composite build* (`includeBuild("../vw_ink_sdk_unofficial")`),
#     so it just needs its source checked out as a sibling of the ForestNote checkout.
#   - RhizomeSync (io.rhizome:*) — consumed as a binary from `mavenLocal()`, so we check it out and
#     `publishToMavenLocal` before building ForestNote.
# Both are public repos, so the default token can clone them. To keep the sibling layout the
# `includeBuild("../…")` path expects, every repo is checked out into a subdirectory of the workspace.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ForestNote
        uses: actions/checkout@v4
        with:
          path: ForestNote

      - name: Checkout Viwoods ink SDK (composite build sibling)
        uses: actions/checkout@v4
        with:
          repository: jdkruzr/vw_ink_sdk_unofficial
          path: vw_ink_sdk_unofficial

      - name: Checkout RhizomeSync
        uses: actions/checkout@v4
        with:
          repository: jdkruzr/rhizome
          path: rhizome

      # JDK 17: AGP 8.7's baseline; Kotlin 2.0.21 (ForestNote) + 2.2.0 (rhizome) + Gradle 9.1 are all
      # happy on it (sidesteps the local JDK-25 quirk — reproducible CI toolchain).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # RhizomeSync is consumed from mavenLocal (its Kotlin client lives under client-kotlin/).
      - name: Publish RhizomeSync to mavenLocal
        working-directory: rhizome/client-kotlin
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: ForestNote
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:notes:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forestnote-release-apk
          path: ForestNote/app/notes/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ForestNote/app/notes/build/outputs/apk/release/*.apk
          generate_release_notes: true
