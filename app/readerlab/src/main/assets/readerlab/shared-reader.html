<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' blob:; frame-src blob:; worker-src blob:; object-src 'none'; base-uri 'none'">
<title>ForestRead</title><link rel="stylesheet" href="menu-tokens.css"><link rel="stylesheet" href="lab.css"><link rel="stylesheet" href="selection-handles.css"></head>
<body>
<header><button id="library" aria-label="ForestRead Library" title="ForestRead Library">☰</button><button id="contents" aria-label="Contents" title="Contents">☷</button><button id="reading" aria-label="Reading Settings" title="Reading Settings">Aa</button><button id="prev" aria-label="Previous Page">◀</button><span id="page">—</span><button id="next" aria-label="Next Page">▶</button><span id="editControls" hidden><button id="finishInk" aria-label="Finish Writing" title="Finish Writing">✓</button><button id="cancelInk" aria-label="Cancel Edit" title="Cancel Edit">×</button><button id="retryInk" aria-label="Retry Ink Save" title="Retry Ink Save" hidden>↻</button><button id="draw" class="iconButton" aria-label="Draw" title="Draw; Tap Again For Pen Settings" aria-pressed="true" aria-haspopup="dialog" aria-controls="penOptions" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15-1 6 6-1L21 8l-5-5Z M13 6l5 5 M4 15l5 5"/></svg></button><button id="erase" class="iconButton" aria-label="Stroke Eraser" title="Stroke Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 14 10-11 8 7-10 11H9Z M7 10l8 7 M11 21h10"/></svg></button><button id="spaceMenu" class="iconButton" aria-label="Writing Space" title="Writing Space" aria-haspopup="dialog" aria-controls="spaceOptions" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18 M7 8l5-5 5 5 M7 16l5 5 5-5"/></svg></button></span><span id="selection" hidden><button id="highlight" class="iconButton" aria-label="Accept Highlight" title="Accept Highlight">✓</button><button id="write" class="iconButton" aria-label="Write Note" title="Write Note">✎</button><button id="cancel" class="iconButton" aria-label="Cancel Highlight" title="Cancel Highlight">×</button><button id="boundaryMenu" class="iconButton" aria-label="Highlight Boundaries" title="Highlight Boundaries" aria-haspopup="dialog" aria-controls="boundaryOptions" data-icon="more"></button><button id="retrySelection" aria-label="Retry Selection Save" hidden>Retry</button></span></header>
<main id="reader"></main>
<img id="editBackdrop" alt="" hidden>
<dialog id="penOptions" class="anchoredPopup penuPopup" aria-label="Pen Settings">
  <div class="penuTop">
    <div class="menuHeading"><strong>Pen Settings</strong><button id="closePenOptions" class="iconButton" aria-label="Close Pen Settings">×</button></div>
    <div class="widthHeading"><label>Thickness <input id="width" type="number" value="35" min="7" max="250"></label><span id="activePenName">Fountain</span></div>
    <div id="widthPresets" role="group" aria-label="Pen Thickness Presets"></div>

  </div>
  <select id="pen" hidden>
      <optgroup label="Pens"><option value="FOUNTAIN">Fountain</option><option value="BALLPOINT">Ballpoint</option><option value="FINELINER">Fineliner</option><option value="BRUSH">Brush</option><option value="DASHED">Dashed Line</option></optgroup>
      <optgroup label="Pencils"><option value="PENCIL_HB">Pencil HB</option><option value="PENCIL_2B">Pencil 2B</option><option value="PENCIL_4B">Pencil 4B</option><option value="PENCIL_6B">Pencil 6B</option><option value="PENCIL_8B">Pencil 8B</option></optgroup>
      <optgroup label="Markers"><option value="MARKER">Marker</option><option value="TRANSLUCENT_MARKER">Translucent Marker</option><option value="HIGHLIGHTER">Highlighter</option></optgroup>
      <optgroup label="Calligraphy"><option value="CALLIGRAPHY">Calligraphy</option><option value="CALLIGRAPHY_REVERSE">Reverse Calligraphy</option><option value="CALLIGRAPHY_BROAD">Broad Calligraphy</option><option value="CALLIGRAPHY_CHISEL">Chisel Calligraphy</option></optgroup>
    </select>
  <div id="penGroups" class="penuBody"></div>
</dialog>
<dialog id="spaceOptions" class="anchoredPopup popupCompact" aria-label="Writing Space"><div class="menuHeading"><strong>Writing Space</strong><button id="closeSpace" class="iconButton" aria-label="Close Writing Space">×</button></div><div class="compactSettings"><label>Height <input id="height" type="number" min="200" max="60000" step="100"></label><div class="row"><button id="shrinkSpace">− Three Lines</button><button id="growSpace">+ Three Lines</button></div><button id="applySpace">Apply Writing Space</button></div></dialog>
<div id="draftHighlight" aria-hidden="true"></div>
<button class="handle" id="startHandle" data-side="left" hidden aria-label="Drag Highlight Start"></button><button class="handle" id="endHandle" data-side="right" hidden aria-label="Drag Highlight End"></button>
<dialog id="boundaryOptions" class="anchoredPopup popupCompact" aria-label="Highlight Boundaries"><div class="row boundaryControls"><span>Start</span><button id="startEarlier" aria-label="Move Highlight Start One Word Earlier">←</button><button id="startLater" aria-label="Move Highlight Start One Word Later">→</button><span>End</span><button id="endEarlier" aria-label="Move Highlight End One Word Earlier">←</button><button id="endLater" aria-label="Move Highlight End One Word Later">→</button></div></dialog>
<dialog id="savedHighlightOptions" class="anchoredPopup popupCompact" aria-label="Highlight Actions"><div class="menuHeading"><strong>Highlight</strong><button id="closeSavedHighlight" class="iconButton" aria-label="Close Highlight Actions">×</button></div><button id="writeSavedHighlight">Write Note</button><button id="adjustSavedHighlight">Adjust Highlight</button></dialog>
<dialog id="shelves" class="anchoredPopup popupWide" aria-label="Books"><div class="menuHeading"><strong>Books</strong><button id="import">Import Book…</button><button id="closeShelves" class="iconButton" aria-label="Close Books">×</button></div><div id="bookRows" class="penuBody"></div></dialog>
<dialog id="chapters" class="anchoredPopup popupWide" aria-label="Contents"><div class="menuHeading"><strong>Contents</strong><button id="closeChapters" class="iconButton" aria-label="Close Contents">×</button></div><div id="chapterRows" class="penuBody"></div></dialog>
<dialog id="settings" class="anchoredPopup penuPopup" aria-label="Reading Settings"><div class="menuHeading"><strong>Reading Settings</strong><button id="closeSettings" class="iconButton" aria-label="Close Reading Settings">×</button></div><div class="compactSettings">
<label>Font Size <input id="fontSize" type="number" min="12" max="64" value="22"></label><label>Line Spacing <input id="lineHeight" type="number" min="1" max="3" step="0.1" value="1.5"></label><label>Letter Spacing <input id="letterSpacing" type="number" min="0" max="5" step="0.25" value="0"></label><label>Word Spacing <input id="wordSpacing" type="number" min="0" max="12" step="1" value="0"></label><label>Paragraph Spacing <input id="paragraphSpacing" type="number" min="0" max="3" step="0.25" value="1"></label><button id="apply">Apply Reading Settings</button><button id="refresh">Clear Ghosting</button></div></dialog>
<dialog id="imageZoom" aria-label="Image Zoom"><div class="zoomHeading"><strong>Image Zoom</strong><span id="zoomScale">100%</span><button id="closeImageZoom" class="iconButton" aria-label="Close Image Zoom">×</button></div><div id="imageZoomStage"><img id="zoomImage" alt="Book Image" draggable="false" hidden></div></dialog>
<footer><span id="status">Opening Shared Library…</span><span id="title" dir="auto">No Book Open</span></footer>
<script src="shared-reader.js" type="module"></script></body></html>
